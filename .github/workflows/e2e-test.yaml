name: e2e-test

on:
  workflow_call:
  workflow_dispatch:

# Spend CI time only on latest ref
concurrency:
  group: e2e-test-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  NEXTEST_PROFILE: "ci"
  MAIN_CRATE: "astarte-device-fdo"
  EXPORT_FOR_CI: "true"

jobs:
  e2e-test:
    name: e2e-test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Astarte requires too many resources for a private repo runner
    if: "!github.event.repository.private"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - parallel:
          - name: Create Astarte Cluster
            id: astarte
            uses: astarte-platform/astarte-cluster-action@11198ae9f8b4b1d334063a6ce6c1015da631c6ff # v2.0.0
            with:
              astarte_version: 1.3.0
          - uses: $/.github/actions/install-deps
      - run: ./scripts/ci/e2e-test.sh
      - name: post
        if: ${{ always() }}
        run: ./scripts/ci/e2e-post.sh
  fdo:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: $/.github/actions/install-deps
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: cache container build
        id: cache-container
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/cache/containers
          key: ${{ runner.os }}-${{ hashFiles('justfile', 'scripts/**/*.sh', 'containers/**') }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - run: |
          just setup
          just run
