[package]
name = "e2e-test"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fdo-cli"
path = "src/main.rs"

[dependencies]
astarte-device-fdo.workspace = true
astarte-device-tls = { workspace = true, default-features = false }
cfg-if.workspace = true
clap = { workspace = true, features = ["derive"] }
color-eyre.workspace = true
eyre.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-error.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
uuid = { workspace = true, features = ["v7"] }

[features]
default = ["platform-verifier"]
# Use the Platform Verifier for TLS
platform-verifier = ["astarte-device-tls/platform-verifier"]
# Use an embedded CA chain for TLS
webpki-roots = ["astarte-device-tls/webpki-roots"]
# Uses the TPM for cryptography
tpm = ["astarte-device-fdo/tpm"]
